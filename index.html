<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TruckTraffic.in – India's Truck Load Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0A2463;
      --orange: #FF6B35;
      --green: #248232;
      --bg: #F0F2F7;
      --surface: #FFFFFF;
      --text: #1A1A2E;
      --muted: #6C757D;
      --subtle: #ADB5BD;
      --border: #DEE2E6;
      --danger: #DC3545;
      --row-hover: #F4F6FB;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* FIX 1: full-height flex column so footer stays anchored */
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--navy);
      padding: 0 24px;
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 4px 20px rgba(10,36,99,0.3);
      flex-shrink: 0;
    }
    .header-inner {
      max-width: 1400px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .logo-icon {
      width:36px; height:36px; background:var(--orange);
      border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px;
    }
    .logo-text { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:#fff; letter-spacing:0.5px; }
    .logo-text span { color:var(--orange); }
    .header-right { display:flex; align-items:center; gap:14px; }
    .live-badge {
      display:flex; align-items:center; gap:6px;
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
      border-radius:100px; padding:5px 12px; color:#fff; font-size:12px; font-weight:600;
    }
    .live-dot { width:7px; height:7px; background:#4ade80; border-radius:50%; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .download-btn {
      background:var(--orange); color:#fff; border:none; border-radius:8px;
      padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;
      text-decoration:none; font-family:'Inter',sans-serif; transition:background 0.2s;
    }
    .download-btn:hover { background:#e85a25; }

    /* ===== DESKTOP FILTER BAR ===== */
    .filter-bar {
      background: linear-gradient(135deg,#0d2f7a,var(--navy));
      padding: 14px 24px;
      border-bottom: 3px solid var(--orange);
      position: sticky; top: 60px; z-index: 150;
      flex-shrink: 0;
    }
    .filter-bar-inner {
      max-width:1400px; margin:0 auto;
      display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap;
    }
    .filter-field { display:flex; flex-direction:column; gap:4px; }
    .filter-field label {
      font-size:10px; font-weight:600;
      color:rgba(255,255,255,0.65); text-transform:uppercase; letter-spacing:0.5px;
    }

    /* location input */
    .loc-input-wrap { position:relative; width:190px; }
    .loc-input-inner {
      display:flex; align-items:center;
      background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.2);
      border-radius:9px; height:40px; transition:border-color 0.2s;
    }
    .loc-input-inner:focus-within { border-color:var(--orange); }
    .loc-input-inner input {
      flex:1; padding:0 6px 0 12px;
      border:none !important; background:transparent !important;
      color:#fff !important; font-size:13px; font-family:'Inter',sans-serif;
      outline:none !important; min-width:0; height:100%;
    }
    .loc-input-inner input::placeholder { color:rgba(255,255,255,0.38); }
    .loc-voice-btn {
      flex-shrink:0; width:28px; height:28px; margin-right:4px;
      border:none; background:transparent; color:rgba(255,255,255,0.5);
      cursor:pointer; border-radius:5px; display:flex; align-items:center;
      justify-content:center; font-size:14px; transition:color 0.2s;
    }
    .loc-voice-btn:hover { color:#fff; background:rgba(255,255,255,0.1); }
    .loc-voice-btn.listening { color:#FF6B6B; animation:voicePulse 1s infinite; }
    @keyframes voicePulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .loc-type-badge {
      position:absolute; top:-8px; right:6px;
      font-size:9px; font-weight:700; letter-spacing:0.4px;
      text-transform:uppercase; padding:1px 5px;
      border-radius:100px; pointer-events:none;
    }
    .loc-type-badge.pin  { background:rgba(255,107,53,0.85); color:#fff; }
    .loc-type-badge.addr { background:rgba(74,222,128,0.85); color:#002; }
    .loc-suggestions {
      position:absolute; top:calc(100% + 4px); left:0; right:0;
      background:#fff; border:1px solid var(--border);
      border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,0.2);
      z-index:999; max-height:220px; overflow-y:auto; display:none;
      min-width:260px;
    }
    .loc-suggestions.open { display:block; }
    .loc-suggestion-item {
      padding:9px 13px; font-size:13px; color:var(--text);
      cursor:pointer; display:flex; align-items:flex-start;
      gap:7px; border-bottom:1px solid var(--border); transition:background 0.15s;
    }
    .loc-suggestion-item:last-child { border-bottom:none; }
    .loc-suggestion-item:hover { background:#F0F4FF; }
    .loc-suggestion-icon { flex-shrink:0; margin-top:1px; color:var(--navy); }
    .loc-suggestion-main { font-weight:600; color:var(--text); }
    .loc-suggestion-sub  { font-size:11px; color:var(--muted); margin-top:1px; }
    .loc-suggestion-spinner { padding:11px 14px; color:var(--muted); font-size:13px; text-align:center; }

    /* FIX 6: weight in tons */
    .filter-field input[type="number"] {
      padding:0 12px; height:40px;
      border:1.5px solid rgba(255,255,255,0.2); border-radius:9px;
      font-size:13px; font-family:'Inter',sans-serif;
      background:rgba(255,255,255,0.1); color:#fff; outline:none; width:110px;
      transition:border-color 0.2s; -moz-appearance:textfield;
    }
    .filter-field input[type="number"]::-webkit-outer-spin-button,
    .filter-field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }
    .filter-field input[type="number"]::placeholder { color:rgba(255,255,255,0.38); }
    .filter-field input[type="number"]:focus { border-color:var(--orange); }

    .filter-btn-group { display:flex; align-items:flex-end; gap:8px; margin-left:auto; }
    .btn-find {
      height:40px; padding:0 20px; background:var(--orange); color:#fff;
      border:none; border-radius:9px; font-size:13px; font-weight:700;
      cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.2s; white-space:nowrap;
    }
    .btn-find:hover { background:#e85a25; }
    .btn-find:disabled { background:#888; cursor:not-allowed; }
    .btn-refresh {
      height:40px; padding:0 16px; background:rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.85); border:1.5px solid rgba(255,255,255,0.2);
      border-radius:9px; font-size:13px; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.2s; white-space:nowrap;
      display:flex; align-items:center; gap:5px;
    }
    .btn-refresh:hover { background:rgba(255,255,255,0.2); }
    .btn-clear {
      height:40px; padding:0 14px; background:transparent;
      color:rgba(255,255,255,0.65); border:1.5px solid rgba(255,255,255,0.2);
      border-radius:9px; font-size:13px; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.2s; white-space:nowrap;
    }
    .btn-clear:hover { background:rgba(255,255,255,0.1); color:#fff; }
    .filter-status-row {
      max-width:1400px; margin:6px auto 0;
      display:flex; align-items:center; gap:12px; min-height:18px;
    }
    .filter-error  { color:#FF8080; font-size:12px; font-weight:500; }
    .filter-status { color:rgba(255,255,255,0.6); font-size:12px; }

    /* ===== MOBILE SEARCH BAR ===== */
    .mobile-search-bar {
      display:none;
      background:linear-gradient(135deg,#0d2f7a,var(--navy));
      padding:10px 16px;
      border-bottom:3px solid var(--orange);
      position:sticky; top:60px; z-index:150;
      flex-shrink:0;
    }
    .mobile-search-trigger {
      display:flex; align-items:center; gap:10px;
      background:rgba(255,255,255,0.12);
      border:1.5px solid rgba(255,255,255,0.25);
      border-radius:100px; padding:10px 16px;
      cursor:pointer; transition:background 0.2s;
    }
    .mobile-search-trigger:hover { background:rgba(255,255,255,0.18); }
    .mobile-search-icon { font-size:16px; color:rgba(255,255,255,0.7); }
    .mobile-search-text { flex:1; font-size:14px; color:rgba(255,255,255,0.55); font-family:'Inter',sans-serif; }
    .mobile-active-badge {
      background:var(--orange); color:#fff;
      border-radius:100px; padding:2px 8px;
      font-size:11px; font-weight:700; display:none;
    }
    .mobile-active-badge.visible { display:inline-block; }

    /* ===== MOBILE FILTER DRAWER ===== */
    .mobile-filter-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.5); z-index:400;
    }
    .mobile-filter-overlay.open { display:block; }
    .mobile-filter-drawer {
      position:fixed; bottom:0; left:0; right:0;
      background:linear-gradient(160deg,#0d2f7a,var(--navy));
      border-radius:20px 20px 0 0;
      padding:0 20px 32px;
      z-index:450;
      transform:translateY(100%);
      transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
      max-height:92vh; overflow-y:auto;
    }
    .mobile-filter-drawer.open { transform:translateY(0); }
    .drawer-handle {
      width:40px; height:4px; background:rgba(255,255,255,0.25);
      border-radius:2px; margin:14px auto 20px;
    }
    .drawer-title { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:#fff; margin-bottom:20px; }
    .drawer-field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .drawer-field label { font-size:11px; font-weight:600; color:rgba(255,255,255,0.65); text-transform:uppercase; letter-spacing:0.5px; }
    .drawer-loc-wrap { position:relative; width:100%; }
    .drawer-loc-inner {
      display:flex; align-items:center;
      background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.22);
      border-radius:12px; height:48px; transition:border-color 0.2s;
    }
    .drawer-loc-inner:focus-within { border-color:var(--orange); }
    .drawer-loc-inner input {
      flex:1; padding:0 8px 0 14px;
      border:none !important; background:transparent !important;
      color:#fff !important; font-size:15px; font-family:'Inter',sans-serif;
      outline:none !important; min-width:0; height:100%;
    }
    .drawer-loc-inner input::placeholder { color:rgba(255,255,255,0.38); }
    .drawer-voice-btn {
      flex-shrink:0; width:36px; height:36px; margin-right:6px;
      border:none; background:transparent; color:rgba(255,255,255,0.5);
      cursor:pointer; border-radius:8px;
      display:flex; align-items:center; justify-content:center; font-size:18px;
    }
    .drawer-voice-btn:hover { color:#fff; background:rgba(255,255,255,0.1); }
    .drawer-voice-btn.listening { color:#FF6B6B; animation:voicePulse 1s infinite; }
    .drawer-loc-suggestions {
      position:absolute; top:calc(100% + 4px); left:0; right:0;
      background:#fff; border:1px solid var(--border);
      border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.25);
      z-index:999; max-height:220px; overflow-y:auto; display:none;
    }
    .drawer-loc-suggestions.open { display:block; }
    .drawer-field input[type="number"] {
      padding:0 14px; height:48px;
      border:1.5px solid rgba(255,255,255,0.22); border-radius:12px;
      font-size:15px; font-family:'Inter',sans-serif;
      background:rgba(255,255,255,0.1); color:#fff; outline:none; width:100%;
      transition:border-color 0.2s; -moz-appearance:textfield;
    }
    .drawer-field input[type="number"]::-webkit-outer-spin-button,
    .drawer-field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }
    .drawer-field input[type="number"]::placeholder { color:rgba(255,255,255,0.38); }
    .drawer-field input[type="number"]:focus { border-color:var(--orange); }
    /* FIX 5: centred button row */
    .drawer-btn-row { display:flex; gap:10px; margin-top:20px; justify-content:center; }
    .drawer-btn-find {
      flex:1; height:48px; background:var(--orange); color:#fff;
      border:none; border-radius:12px; font-size:15px; font-weight:700;
      cursor:pointer; font-family:'Inter',sans-serif; transition:background 0.2s;
    }
    .drawer-btn-find:hover { background:#e85a25; }
    .drawer-btn-find:disabled { background:#888; cursor:not-allowed; }
    .drawer-btn-refresh {
      height:48px; padding:0 18px;
      background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.85);
      border:1.5px solid rgba(255,255,255,0.2); border-radius:12px;
      font-size:15px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
      display:flex; align-items:center; gap:6px; transition:background 0.2s;
    }
    .drawer-btn-refresh:hover { background:rgba(255,255,255,0.2); }
    .drawer-btn-clear {
      height:48px; padding:0 16px; background:transparent;
      color:rgba(255,255,255,0.65); border:1.5px solid rgba(255,255,255,0.2);
      border-radius:12px; font-size:15px; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif;
    }
    .drawer-status { margin-top:10px; font-size:12px; color:rgba(255,255,255,0.6); text-align:center; }
    .drawer-error  { margin-top:8px; font-size:12px; color:#FF8080; font-weight:500; text-align:center; }

    /* ===== RESULTS BAR ===== */
    .results-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 24px; flex-shrink:0; }
    .results-bar-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
    .results-count { font-size:13px; color:var(--muted); font-weight:500; }

    /* ===== MAIN (flex:1 pushes footer down) ===== */
    .main {
      max-width:1400px; margin:0 auto;
      padding:20px 24px 40px; width:100%;
      flex:1;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      background:var(--surface); border-radius:14px;
      border:1px solid var(--border); overflow:hidden;
      box-shadow:0 2px 12px rgba(10,36,99,0.06);
      overflow-x:auto;
    }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead { background:linear-gradient(135deg,var(--navy),#1a3a8f); }
    thead th {
      padding:13px 14px; text-align:left;
      font-size:11px; font-weight:700;
      color:rgba(255,255,255,0.75); text-transform:uppercase;
      letter-spacing:0.6px; white-space:nowrap; user-select:none;
    }
    tbody tr { border-bottom:1px solid var(--border); transition:background 0.12s; cursor:pointer; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--row-hover); }
    tbody tr.highlighted { background:#EEF4FF; }
    td { padding:12px 14px; vertical-align:middle; }

    /* Route — Area / State / Pincode order */
    .td-route { display:flex; align-items:center; gap:6px; }
    .route-endpoint { min-width:0; }
    .td-area {
      font-size:13px; font-weight:700; color:var(--text);
      line-height:1.2; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; max-width:90px;
    }
    .td-state {
      font-size:10px; color:var(--muted);
      margin-top:1px; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; max-width:80px;
    }
    .td-pin {
      font-family:'Rajdhani',sans-serif;
      font-size:12px; font-weight:600; color:var(--subtle);
      margin-top:1px; white-space:nowrap;
    }
    .td-arrow { color:var(--orange); font-size:13px; flex-shrink:0; padding:0 2px; }

    .truck-pill {
      display:inline-flex; align-items:center; gap:4px;
      background:#EEF2FA; color:var(--navy);
      border-radius:100px; padding:3px 10px;
      font-size:11px; font-weight:700; white-space:nowrap;
    }
    .place-pill {
      display:inline-block; background:#FFF4EE; color:var(--orange);
      border-radius:100px; padding:3px 9px;
      font-size:11px; font-weight:600; white-space:nowrap;
    }
    .td-weight {
      font-family:'Rajdhani',sans-serif;
      font-size:16px; font-weight:700; color:var(--navy); white-space:nowrap;
    }
    .dist-badge {
      display:inline-block; background:#E8F5EA; color:var(--green);
      border-radius:100px; padding:2px 8px;
      font-size:10px; font-weight:700; white-space:nowrap; margin-bottom:3px;
    }
    .td-date { color:var(--muted); white-space:nowrap; font-size:12px; }
    .photo-count { display:inline-flex; align-items:center; gap:4px; color:var(--navy); font-size:12px; font-weight:600; }
    .info-btn {
      display:inline-flex; align-items:center; gap:5px;
      padding:6px 14px; border-radius:100px;
      background:var(--navy); color:#fff;
      border:none; cursor:pointer; font-size:12px; font-weight:600;
      font-family:'Inter',sans-serif; transition:background 0.15s; white-space:nowrap;
    }
    .info-btn:hover { background:#0d2f7a; }

    /* ===== DETAIL PANEL ===== */
    .detail-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:500; }
    .detail-overlay.open { display:block; }
    .detail-panel {
      position:fixed; top:0; right:0; bottom:0;
      width:480px; max-width:100vw;
      background:var(--surface); box-shadow:-8px 0 40px rgba(10,36,99,0.18);
      z-index:600; display:flex; flex-direction:column;
      transform:translateX(100%);
      transition:transform 0.28s cubic-bezier(0.4,0,0.2,1); overflow:hidden;
    }
    .detail-panel.open { transform:translateX(0); }
    .detail-header {
      background:linear-gradient(135deg,var(--navy),#1a3a8f);
      padding:20px 20px 24px;
      display:flex; align-items:flex-start; justify-content:space-between;
      flex-shrink:0;
    }
    .detail-close {
      background:rgba(255,255,255,0.15); border:none; color:#fff;
      width:32px; height:32px; border-radius:50%;
      cursor:pointer; font-size:16px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; margin-left:12px; transition:background 0.15s;
    }
    .detail-close:hover { background:rgba(255,255,255,0.28); }
    .detail-route-header { flex:1; min-width:0; }
    .detail-truck-badge {
      display:inline-flex; align-items:center; gap:5px;
      background:rgba(255,255,255,0.15);
      border-radius:100px; padding:3px 10px;
      font-size:11px; font-weight:700; color:#fff; margin-bottom:12px;
    }

    /* Route — stacked vertically for clarity */
    .detail-route-stack { display:flex; flex-direction:column; gap:0; }
    .detail-endpoint {
      background:rgba(255,255,255,0.08);
      border-radius:12px; padding:12px 14px;
    }
    .detail-pin {
      font-family:'Rajdhani',sans-serif;
      font-size:28px; font-weight:700; color:#fff;
      line-height:1; letter-spacing:0.5px;
    }
    .detail-locality {
      font-size:15px; font-weight:600;
      color:rgba(255,255,255,0.9); margin-top:3px;
    }
    .detail-city-line {
      font-size:12px; color:rgba(255,255,255,0.6); margin-top:2px;
    }
    .detail-state {
      font-size:11px; color:rgba(255,255,255,0.45); margin-top:1px;
    }
    .detail-route-divider {
      display:flex; align-items:center; gap:8px;
      padding:6px 14px;
    }
    .detail-route-divider-line {
      flex:1; height:1px; background:rgba(255,255,255,0.15);
    }
    .detail-route-divider-icon {
      color:var(--orange); font-size:18px; font-weight:700;
    }

    .detail-body { flex:1; overflow-y:auto; padding:20px; }
    .detail-section { margin-bottom:20px; }
    .detail-section-title {
      font-size:10px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:0.7px;
      margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border);
    }

    /* KPI boxes — weight, date, price, dimensions */
    .detail-kpi-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .detail-kpi-row-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
    @media (max-width:520px) { .detail-kpi-row-4 { grid-template-columns:1fr 1fr; } }
    .detail-kpi-sm {
      background:rgba(10,36,99,0.06); border:1px solid var(--border);
      border-radius:12px; padding:12px; text-align:center;
    }
    .detail-kpi-sm-value {
      font-family:'Rajdhani',sans-serif;
      font-size:20px; font-weight:700; color:var(--navy); line-height:1;
    }

    .detail-kpi-date { font-size:20px; }

    .detail-info-row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
    .detail-info-row:last-child { border-bottom:none; }

    /* ===== LOADING / EMPTY / ERROR ===== */

      width:44px; height:44px;
      border:4px solid var(--border); border-top-color:var(--navy);

<footer>

<script>
  const API = 'https://ptl-market.onrender.com/api';

  let allLoads     = [];
  let activeFilter = null;
  let distanceMap  = {};
  const geoCache   = {};
  const resolvedCoords    = { origin: null, dest: null };
  const resolvedCoordsMob = { 'mob-origin': null, 'mob-dest': null };

  // ─── HELPERS ──────────────────────────────────────────────────────────────
  const escapeHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escapeAttr = s => String(s||'').replace(/"/g,'&quot;');
  function formatDate(d) {
    if (!d) return '—';
    try { return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
    catch { return d; }
  }
  function updateBadge(id, val) {
    const el = document.getElementById(id); if (!el) return;
    const v = val.trim();
    if (!v) { el.textContent=''; el.className='loc-type-badge'; return; }
    if (/^\d{6}$/.test(v))   { el.textContent='Pincode';  el.className='loc-type-badge pin'; }
    else if (/^\d+$/.test(v)){ el.textContent='Pincode?'; el.className='loc-type-badge pin'; }
    else                      { el.textContent='Address';  el.className='loc-type-badge addr'; }
  }

  // ─── MOBILE DRAWER ────────────────────────────────────────────────────────
  function openMobileFilter()  { document.getElementById('mobile-filter-overlay').classList.add('open'); document.getElementById('mobile-filter-drawer').classList.add('open'); }
  function closeMobileFilter() { document.getElementById('mobile-filter-overlay').classList.remove('open'); document.getElementById('mobile-filter-drawer').classList.remove('open'); }

  // ─── AUTOCOMPLETE ─────────────────────────────────────────────────────────
  let acTimers = {};

  function setupLocationInput(inputId, suggestionsId, badgeId, resolvedKey, coordsObj) {
    const input  = document.getElementById(inputId);
    const sugBox = document.getElementById(suggestionsId);
    if (!input || !sugBox) return;

    input.addEventListener('input', () => {
      const val = input.value;
      coordsObj[resolvedKey] = null;
      updateBadge(badgeId, val);
      clearTimeout(acTimers[inputId]);
      const trimmed = val.trim();
      if (trimmed.length < 3 || /^\d+$/.test(trimmed)) { closeSuggestions(suggestionsId); return; }
      acTimers[inputId] = setTimeout(() =>
        fetchMapplsSuggestions(trimmed, suggestionsId, inputId, badgeId, resolvedKey, coordsObj), 350);
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSuggestions(suggestionsId);
    });

    document.addEventListener('click', e => {
      const wrap = input.closest('.loc-input-wrap') || input.closest('.drawer-loc-wrap');
      if (wrap && !wrap.contains(e.target)) closeSuggestions(suggestionsId);
    });
  }

  async function fetchMapplsSuggestions(query, suggestionsId, inputId, badgeId, resolvedKey, coordsObj) {
    const sugBox = document.getElementById(suggestionsId);
    sugBox.innerHTML = '<div class="loc-suggestion-spinner">🔍 Searching…</div>';
    sugBox.classList.add('open');
    try {
      const res = await fetch(`${API}/places?query=${encodeURIComponent(query)}`);
      if (!res.ok) throw new Error();
      handleSuggestionsResponse(await res.json(), sugBox, inputId, badgeId, resolvedKey, coordsObj);
    } catch {
      sugBox.innerHTML = '<div class="loc-suggestion-spinner">⚠️ Search unavailable</div>';
    }
  }

  function handleSuggestionsResponse(data, sugBox, inputId, badgeId, resolvedKey, coordsObj) {
    const all = [...(data.suggestedLocations||[]), ...(data.userAddedLocations||[])];
    const pincodeByWord = {};
    all.forEach(s => {
      const m = (s.placeAddress||'').match(/\b(\d{6})\b/);
      if (m) (s.placeName||'').toLowerCase().split(/\s+/).forEach(w => { if (w.length>3 && !pincodeByWord[w]) pincodeByWord[w]=m[1]; });
    });
    const suggestions = all.slice(0,7).map(s => {
      const direct = (s.placeAddress||'').match(/\b(\d{6})\b/);
      const lookup = (s.placeName||'').toLowerCase().split(/\s+/).map(w=>pincodeByWord[w]).find(Boolean);
      return { ...s, pincode: direct ? direct[1] : (lookup||'') };
    }).filter(s => s.pincode);

    if (!suggestions.length) { sugBox.innerHTML='<div class="loc-suggestion-spinner">No results found</div>'; return; }

    sugBox.innerHTML = suggestions.map(s => `
      <div class="loc-suggestion-item" data-pincode="${escapeAttr(s.pincode)}" data-label="${escapeAttr(s.placeName)}">
        <span class="loc-suggestion-icon">📍</span>
        <div>
          <div class="loc-suggestion-main">${escapeHtml(s.placeName)}</div>
          <div class="loc-suggestion-sub">${escapeHtml(s.placeAddress||'')}</div>
        </div>
      </div>`).join('');

    sugBox.querySelectorAll('.loc-suggestion-item').forEach(item => {
      item.addEventListener('click', async () => {
        const label = item.dataset.label, pincode = item.dataset.pincode;
        document.getElementById(inputId).value = label;
        updateBadge(badgeId, label);
        closeSuggestions(sugBox.id);
        if (pincode) {
          const geo = await geocodePin(pincode);
          coordsObj[resolvedKey] = geo.found ? { lat:geo.lat, lon:geo.lon, found:true, pincode } : { found:false, pincode };
        } else {
          coordsObj[resolvedKey] = { found:false, label };
        }
      });
    });
  }

  function closeSuggestions(id) {
    const el = document.getElementById(id);
    if (el) { el.classList.remove('open'); el.innerHTML=''; }
  }

  // ─── VOICE ────────────────────────────────────────────────────────────────
  let activeRecognition = null;
  function startVoice(inputId, btnId, badgeId) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Voice not supported. Use Chrome or Edge.'); return; }
    if (activeRecognition) { activeRecognition.stop(); activeRecognition = null; }
    const btn = document.getElementById(btnId), input = document.getElementById(inputId);
    const rec = new SR(); activeRecognition = rec;
    rec.lang='en-IN'; rec.interimResults=false; rec.maxAlternatives=1;
    btn.classList.add('listening'); btn.textContent='🔴';
    rec.onresult = e => { input.value = e.results[0][0].transcript; input.dispatchEvent(new Event('input')); };
    rec.onerror  = e => console.warn('Voice error:', e.error);
    rec.onend    = () => { btn.classList.remove('listening'); btn.textContent='🎙'; activeRecognition=null; };
    rec.start();
  }

  // ─── GEO MATH ─────────────────────────────────────────────────────────────
  const toRad = d => d*Math.PI/180;
  function haversineKm(a,b) {
    const R=6371,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon);
    return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2));
  }
  function bearingRad(a,b) {
    const lat1=toRad(a.lat),lat2=toRad(b.lat),dLon=toRad(b.lon-a.lon);
    return Math.atan2(Math.sin(dLon)*Math.cos(lat2),Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon));
  }
  function trackDistancesKm(start,end,p) {
    const R=6371,d13=haversineKm(start,p)/R,t13=bearingRad(start,p),t12=bearingRad(start,end);
    const xt=Math.asin(Math.sin(d13)*Math.sin(t13-t12))*R;
    const at=Math.acos(Math.cos(d13)/Math.cos(xt/R))*R;
    return { cross:Math.abs(xt), along:at };
  }
  async function geocodePin(pin) {
    if (geoCache[pin]) return geoCache[pin];
    try {
      const r=await fetch(`${API}/geocode/${pin}`), j=await r.json();
      const out={lat:j.lat||0,lon:j.lon||0,found:!!j.found};
      if(out.found) geoCache[pin]=out; return out;
    } catch { return {lat:0,lon:0,found:false}; }
  }

  // ─── RESOLVE LOCATION ─────────────────────────────────────────────────────
  async function resolveLocation(inputId, coordsObj, resolvedKey, labelName) {
    const val = document.getElementById(inputId).value.trim();
    if (!val) return { coords:null, error:`⚠️ Enter your ${labelName}` };
    if (coordsObj[resolvedKey]?.found) return { coords:coordsObj[resolvedKey], error:null };
    if (coordsObj[resolvedKey]?.pincode) {
      const geo = await geocodePin(coordsObj[resolvedKey].pincode);
      return geo.found ? { coords:geo, error:null } : { coords:null, error:`⚠️ Could not geocode ${labelName}` };
    }
    if (/^\d{6}$/.test(val)) {
      const c = await geocodePin(val);
      return c.found ? { coords:c, error:null } : { coords:null, error:`⚠️ ${labelName} pincode not found` };
    }
    if (/^\d+$/.test(val)) return { coords:null, error:`⚠️ Pincodes must be 6 digits` };
    try {
      const res=await fetch(`${API}/places?query=${encodeURIComponent(val)}`), data=await res.json();
      const first=(data.suggestedLocations||[])[0];
      if (first) { const m=(first.placeAddress||'').match(/\b(\d{6})\b/); if(m){ const geo=await geocodePin(m[1]); if(geo.found) return {coords:geo,error:null}; } }
      return { coords:null, error:`⚠️ Could not locate "${val}". Use a pincode or select from dropdown.` };
    } catch { return { coords:null, error:`⚠️ Address search failed. Use a pincode.` }; }
  }

  // ─── FIND SPACE (shared) ──────────────────────────────────────────────────
  async function runFind(originId,destId,weightId,coordsObj,originKey,destKey,errorId,statusId,btnId,isMobile) {
    // FIX 6: weight is in tons now
    const weightTons = parseFloat(document.getElementById(weightId).value);
    const errorEl = document.getElementById(errorId), statusEl = document.getElementById(statusId);
    errorEl.textContent=''; statusEl.textContent='';
    if (!weightTons || weightTons<=0) { errorEl.textContent='⚠️ Enter cargo weight in tons'; return; }

    const btn = document.getElementById(btnId);
    btn.disabled=true; btn.textContent='⏳ Searching…';
    statusEl.textContent='Resolving locations…';

    try {
      const [oRes,dRes] = await Promise.all([
        resolveLocation(originId,coordsObj,originKey,'origin'),
        resolveLocation(destId,  coordsObj,destKey,  'destination'),
      ]);
      if (oRes.error) { errorEl.textContent=oRes.error; return; }
      if (dRes.error) { errorEl.textContent=dRes.error; return; }

      const oc=oRes.coords, dc=dRes.coords;
      statusEl.textContent=`Checking ${allLoads.length} trucks…`;
      const survivors=[]; distanceMap={};

      for (const load of allLoads) {
        // FIX 6: tons vs tons
        if (load.weight_tons < weightTons) continue;
        const lo=await geocodePin(load.origin_pincode); if(!lo.found) continue;
        const ld=await geocodePin(load.destination_pincode); if(!ld.found) continue;
        const dOrigin=haversineKm(oc,lo), dDest=haversineKm(dc,ld);
        if (dOrigin<=15 && dDest<=15) {
          distanceMap[load.id]={origin:dOrigin,dest:dDest,offRoute:false};
          survivors.push({load,total:dOrigin+dDest}); continue;
        }
        const routeLen=haversineKm(lo,ld);
        if (routeLen>400) {
          const oT=trackDistancesKm(lo,ld,oc),dT=trackDistancesKm(lo,ld,dc);
          const inSeg=at=>at>=0&&at<=routeLen;
          if(oT.cross<=15&&dT.cross<=15&&inSeg(oT.along)&&inSeg(dT.along)&&oT.along<=dT.along){
            distanceMap[load.id]={origin:oT.cross,dest:dT.cross,offRoute:true};
            survivors.push({load,total:oT.cross+dT.cross});
          }
        }
      }

      survivors.sort((a,b)=>a.total-b.total);
      activeFilter={
        origin: document.getElementById(originId).value.trim(),
        dest:   document.getElementById(destId).value.trim(),
        weightTons, oc, dc
      };

      const matchMsg=`${survivors.length} truck${survivors.length!==1?'s':''} matched`;
      document.getElementById('results-count').textContent=matchMsg;
      statusEl.textContent=`✅ ${matchMsg} within 15 km of your route`;

      if (isMobile) {
        document.getElementById('mob-clear-btn').style.display='inline-flex';
        const hint=document.getElementById('mobile-search-hint');
        hint.textContent=`${activeFilter.origin} → ${activeFilter.dest} · ${weightTons}T`;
        document.getElementById('mobile-active-badge').classList.add('visible');
        closeMobileFilter();
      } else {
        document.getElementById('fs-clear-btn').style.display='inline-flex';
      }

      renderTable(survivors.map(s=>s.load), true);
    } catch(e) {
      console.error(e);
      errorEl.textContent='⚠️ Something went wrong. Try again.';
    } finally {
      btn.disabled=false; btn.textContent='🚛 Find Trucks';
    }
  }

  function findSpace()       { runFind('fs-origin','fs-dest','fs-weight',resolvedCoords,'origin','dest','fs-error','fs-status','fs-btn',false); }
  function findSpaceMobile() { runFind('mob-origin','mob-dest','mob-weight',resolvedCoordsMob,'mob-origin','mob-dest','mob-fs-error','mob-fs-status','mob-fs-btn',true); }

  function clearFindSpace() {
    activeFilter=null; distanceMap={};
    resolvedCoords.origin=null; resolvedCoords.dest=null;
    ['fs-origin','fs-dest'].forEach(id=>document.getElementById(id).value='');
    ['origin-badge','dest-badge'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent='';el.className='loc-type-badge';}});
    document.getElementById('fs-clear-btn').style.display='none';
    document.getElementById('fs-error').textContent='';
    document.getElementById('fs-status').textContent='';
    filterLoads();
  }

  function clearMobileFilter() {
    activeFilter=null; distanceMap={};
    resolvedCoordsMob['mob-origin']=null; resolvedCoordsMob['mob-dest']=null;
    ['mob-origin','mob-dest'].forEach(id=>document.getElementById(id).value='');
    ['mob-origin-badge','mob-dest-badge'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent='';el.className='loc-type-badge';}});
    document.getElementById('mob-clear-btn').style.display='none';
    document.getElementById('mob-fs-error').textContent='';
    document.getElementById('mob-fs-status').textContent='';
    document.getElementById('mobile-search-hint').textContent='Search by origin, destination & weight…';
    document.getElementById('mobile-active-badge').classList.remove('visible');
    filterLoads(); closeMobileFilter();
  }

  // ─── FETCH & RENDER ───────────────────────────────────────────────────────
  async function fetchLoads() {
    const container=document.getElementById('loads-container'), errorCont=document.getElementById('error-container');
    errorCont.innerHTML='';
    container.innerHTML='<div class="loading"><div class="spinner"></div><p>Loading live truck loads…</p></div>';
    try {
      const res=await fetch(`${API}/loads`); if(!res.ok) throw new Error();
      allLoads=await res.json(); filterLoads();
    } catch {
      errorCont.innerHTML='<div class="error-banner">⚠️ Unable to load data. Please try refreshing.</div>';
      container.innerHTML='<div class="empty"><div class="empty-icon">📡</div><h3>Connection Error</h3><p>Could not connect to the server.</p></div>';
    }
  }

  function filterLoads() {
    document.getElementById('results-count').textContent=`${allLoads.length} truck${allLoads.length!==1?'s':''} available`;
    renderTable(allLoads,false);
  }

  function renderTable(loads,isFiltered) {
    const container=document.getElementById('loads-container');
    if (!loads.length) {
      container.innerHTML=`<div class="empty"><div class="empty-icon">🚛</div><h3>${isFiltered?'No matching trucks found':'No loads found'}</h3><p>${isFiltered?'Try adjusting your search.':'Check back later.'}</p></div>`;
      return;
    }

    const rows=loads.map(l => {
      // Route cells — area / state / pincode order (variables declared inside template below)
      const dist=distanceMap[l.id];
      const imageCount=l.image_count||(l.images?l.images.length:0);
      const distHtml=dist?`<div style="margin-top:3px"><span class="dist-badge">📍${dist.origin.toFixed(1)}km</span> <span class="dist-badge">🏁${dist.dest.toFixed(1)}km</span></div>`:'';

      const oArea  = l.origin_locality || l.origin_city || '';
      const oState = l.origin_state || '';
      const oPin   = l.origin_pincode || '';
      const dArea  = l.destination_locality || l.destination_city || '';
      const dState = l.destination_state || '';
      const dPin   = l.destination_pincode || '';
      return `<tr onclick="openDetail('${escapeAttr(l.id)}')" title="Tap for full details">
        <td>
          <div class="td-route">
            <div class="route-endpoint">
              ${oArea  ? `<div class="td-area">${escapeHtml(oArea)}</div>`  : ''}
              ${oState ? `<div class="td-state">${escapeHtml(oState)}</div>` : ''}
              ${oPin   ? `<div class="td-pin">${escapeHtml(oPin)}</div>`    : ''}
            </div>
            <span class="td-arrow">➤</span>
            <div class="route-endpoint">
              ${dArea  ? `<div class="td-area">${escapeHtml(dArea)}</div>`  : ''}
              ${dState ? `<div class="td-state">${escapeHtml(dState)}</div>` : ''}
              ${dPin   ? `<div class="td-pin">${escapeHtml(dPin)}</div>`    : ''}
            </div>
          </div>
          ${distHtml}
        </td>
        <td><span class="truck-pill">🚛 ${escapeHtml(l.truck_type||'—')}</span></td>
        <td><span class="td-weight">${l.weight_tons}T</span></td>
        <td class="col-placement">${l.cargo_placement?`<span class="place-pill">${escapeHtml(l.cargo_placement)}</span>`:'—'}</td>
        <td class="col-date td-date">${formatDate(l.loading_date)}</td>
        <td class="col-photos">${imageCount>0?`<span class="photo-count">📸 ${imageCount}</span>`:'<span style="color:var(--subtle)">—</span>'}</td>
        <td class="col-btn"><button class="info-btn" onclick="event.stopPropagation();openDetail('${escapeAttr(l.id)}')">More Info ›</button></td>
      </tr>`;
    }).join('');

    container.innerHTML=`
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Route</th><th>Truck</th><th>Weight</th>
              <th class="col-placement">Placement</th>
              <th class="col-date">Loading Date</th>
              <th class="col-photos">Photos</th>
              <th class="col-btn"></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${isFiltered?'<p style="text-align:center;color:var(--subtle);font-size:11px;margin-top:12px">* Distances are approximate (straight-line)</p>':''}
    `;
  }

  // ─── DETAIL PANEL ─────────────────────────────────────────────────────────
  function openDetail(loadId) {
    const load=allLoads.find(l=>l.id===loadId); if(!load) return;
    const imageCount=load.image_count||(load.images?load.images.length:0);
    const dist=distanceMap[load.id];

    // Build endpoint — order: Area (locality/city) → State → Pincode
    function buildEndpoint(pin, locality, city, state) {
      const loc = (locality||'').trim();
      const cty = (city||'').trim();
      const st  = (state||'').trim();
      // Area: prefer locality, fall back to city
      const area = loc || cty || null;
      // State: show only if different from area
      const showState = st && st.toLowerCase() !== (area||'').toLowerCase() ? st : null;
      return { pin: pin||null, area, state: showState };
    }

    const oE = buildEndpoint(load.origin_pincode,      load.origin_locality,      load.origin_city,      load.origin_state);
    const dE = buildEndpoint(load.destination_pincode, load.destination_locality, load.destination_city, load.destination_state);

    function endpointHtml(e) {
      return `
        <div class="detail-endpoint">
          ${e.area  ? `<div class="detail-locality">${escapeHtml(e.area)}</div>` : ''}
          ${e.state ? `<div class="detail-city-line">${escapeHtml(e.state)}</div>` : ''}
          ${e.pin   ? `<div class="detail-pin" style="font-size:22px;margin-top:4px;color:rgba(255,255,255,0.7)">${escapeHtml(e.pin)}</div>` : ''}
        </div>`;
    }

    document.getElementById('detail-header').innerHTML=`
      <div class="detail-route-header">
        <div class="detail-truck-badge">🚛 ${escapeHtml(load.truck_type||'Truck')}</div>
        <div class="detail-route-stack">
          ${endpointHtml(oE)}
          <div class="detail-route-divider">
            <div class="detail-route-divider-line"></div>
            <div class="detail-route-divider-icon">↓</div>
            <div class="detail-route-divider-line"></div>
          </div>
          ${endpointHtml(dE)}
        </div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕</button>`;

    const distSection = dist ? `
      <div class="detail-dist-bar">
        <span class="detail-dist-chip ${dist.offRoute?'off':''}">📍 Origin ${dist.origin.toFixed(1)} km ${dist.offRoute?'off-route':'away'}</span>
        <span class="detail-dist-chip ${dist.offRoute?'off':''}">🏁 Dest ${dist.dest.toFixed(1)} km ${dist.offRoute?'off-route':'away'}</span>
      </div>` : '';

    // Photos — only if they exist
    const photosHtml = (() => {
      if (load.images && load.images.length > 0) {
        return `<div class="detail-section"><div class="detail-section-title">📸 Photos</div><div class="detail-photos-grid">${load.images.slice(0,6).map(src=>`<img src="${escapeAttr(src)}" onclick="openLightbox('${escapeAttr(src)}')" onerror="this.style.display='none'"/>`).join('')}</div></div>`;
      }
      if (imageCount > 0) {
        return `<div class="detail-section"><div class="detail-section-title">📸 Photos</div><div class="detail-photos-grid">${Array.from({length:Math.min(imageCount,6)},(_,i)=>{const src=`${API}/loads/${load.id}/image/${i}`;return `<img src="${escapeAttr(src)}" alt="Photo ${i+1}" onclick="openLightbox('${escapeAttr(src)}')" onerror="this.style.display='none'"/>`;}).join('')}</div></div>`;
      }
      return '';
    })();

    // Dimensions helpers
    const dimParts = [
      load.length_ft ? `${load.length_ft}L` : null,
      load.width_ft  ? `${load.width_ft}W`  : null,
      load.height_ft ? `${load.height_ft}H` : null,
    ].filter(Boolean);
    const dimStr = dimParts.length ? dimParts.join(' × ') + ' ft' : null;
    const volStr = load.space_cuft ? `${load.space_cuft} cu.ft` : null;

    // Price helpers
    const priceStr = load.price_per_ton
      ? `₹${Number(load.price_per_ton).toLocaleString('en-IN')}/T`
      : load.total_price
        ? `₹${Number(load.total_price).toLocaleString('en-IN')}`
        : null;

    document.getElementById('detail-body').innerHTML=`
      ${distSection}

      <div class="detail-kpi-row">
        <div class="detail-kpi">
          <div class="detail-kpi-value">${load.weight_tons}T</div>
          <div class="detail-kpi-label">⚖️ Weight Capacity</div>
        </div>
        <div class="detail-kpi">
          <div class="detail-kpi-value detail-kpi-date">${formatDate(load.loading_date)}</div>
          <div class="detail-kpi-label">📅 Loading Date</div>
        </div>
      </div>

      ${priceStr || dimStr || volStr ? `
      <div class="detail-kpi-row-4">
        ${priceStr ? `
        <div class="price-kpi" style="grid-column:${(!dimStr && !volStr)?'1/3':'auto'}">
          <div class="price-kpi-value">${escapeHtml(priceStr)}</div>
          <div class="price-kpi-label">💰 ${load.price_per_ton ? 'Price / Ton' : 'Total Price'}</div>
        </div>` : ''}
        ${dimStr ? `
        <div class="detail-kpi-sm">
          <div class="detail-kpi-sm-value" style="font-size:15px">${escapeHtml(dimStr)}</div>
          <div class="detail-kpi-sm-label">📐 Dimensions</div>
        </div>` : ''}
        ${volStr ? `
        <div class="detail-kpi-sm">
          <div class="detail-kpi-sm-value">${escapeHtml(volStr)}</div>
          <div class="detail-kpi-sm-label">📦 Volume</div>
        </div>` : ''}
      </div>` : ''}

      <div class="detail-section">
        <div class="detail-section-title">Cargo Details</div>
        <div class="detail-info-row">
          <span class="detail-info-icon">🧱</span>
          <span class="detail-info-label">Placement</span>
          <span class="detail-info-value">${escapeHtml(load.cargo_placement||'—')}</span>
        </div>
        <div class="detail-info-row">
          <span class="detail-info-icon">🚛</span>
          <span class="detail-info-label">Truck Type</span>
          <span class="detail-info-value">${escapeHtml(load.truck_type||'—')}</span>
        </div>
        ${load.cargo_type ? `
        <div class="detail-info-row">
          <span class="detail-info-icon">📦</span>
          <span class="detail-info-label">Cargo Type</span>
          <span class="detail-info-value">${escapeHtml(load.cargo_type)}</span>
        </div>` : ''}
        ${load.length_ft || load.width_ft || load.height_ft ? `
        <div class="detail-info-row">
          <span class="detail-info-icon">📐</span>
          <span class="detail-info-label">Dimensions</span>
          <span class="detail-info-value">${escapeHtml(dimStr||'—')}</span>
        </div>` : ''}
        ${load.space_cuft ? `
        <div class="detail-info-row">
          <span class="detail-info-icon">📦</span>
          <span class="detail-info-label">Volume</span>
          <span class="detail-info-value">${escapeHtml(volStr||'—')}</span>
        </div>` : ''}
        ${load.price_per_ton ? `
        <div class="detail-info-row">
          <span class="detail-info-icon">💰</span>
          <span class="detail-info-label">Rate</span>
          <span class="detail-info-value" style="color:var(--green);font-size:15px;font-weight:700">₹${Number(load.price_per_ton).toLocaleString('en-IN')} / ton</span>
        </div>` : ''}
        ${load.total_price ? `
        <div class="detail-info-row">
          <span class="detail-info-icon">💵</span>
          <span class="detail-info-label">Total Price</span>
          <span class="detail-info-value" style="color:var(--green);font-size:15px;font-weight:700">₹${Number(load.total_price).toLocaleString('en-IN')}</span>
        </div>` : ''}
        ${load.notes ? `
        <div class="detail-info-row">
          <span class="detail-info-icon">📝</span>
          <span class="detail-info-label">Notes</span>
          <span class="detail-info-value">${escapeHtml(load.notes)}</span>
        </div>` : ''}
      </div>

      ${photosHtml}`;

    document.getElementById('detail-footer').innerHTML=`
      <div>
        <div class="detail-poster-name">${escapeHtml(load.poster_name)}</div>
        ${load.poster_company?`<div class="detail-poster-company">${escapeHtml(load.poster_company)}</div>`:''}
        <div class="detail-poster-phone">+91 ${escapeHtml(load.poster_phone)}</div>
      </div>
      <a href="tel:${escapeAttr(load.poster_phone)}" class="detail-call-btn">📞 Call</a>`;

    document.getElementById('detail-overlay').classList.add('open');
    document.getElementById('detail-panel').classList.add('open');
    document.querySelectorAll('tbody tr').forEach(r =>
      r.classList.toggle('highlighted', r.getAttribute('onclick')?.includes(loadId))
    );
  }

  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('open');
    document.getElementById('detail-panel').classList.remove('open');
    document.querySelectorAll('tbody tr').forEach(r=>r.classList.remove('highlighted'));
    // Remove ?load= from URL when panel is closed
    if (window.location.search.includes('load=')) {
      window.history.replaceState({}, '', window.location.pathname);
    }
  }

  // ─── LIGHTBOX ─────────────────────────────────────────────────────────────
  function openLightbox(src) { document.getElementById('lightbox-img').src=src; document.getElementById('lightbox').classList.add('active'); }
  function closeLightbox()   { document.getElementById('lightbox').classList.remove('active'); document.getElementById('lightbox-img').src=''; }
  document.addEventListener('keydown', e => { if(e.key==='Escape'){closeLightbox();closeDetail();closeMobileFilter();} });

  // ─── DEEP LINK: auto-open detail panel from URL ───────────────────────────
  // Supports three URL formats:
  //   /l/{short_id}            → new short link (e.g. /l/a3f9b2c1)
  //   /load/{uuid}             → legacy long-form path
  //   ?load={uuid}             → query-param form (used internally)
  async function handleDeepLink() {
    const params  = new URLSearchParams(window.location.search);
    const path    = window.location.pathname;

    // Detect format
    const shortMatch  = path.match(/^\/l\/([a-z0-9]+)$/i);
    const pathMatch   = path.match(/^\/load\/([^\/\?#]+)/);
    const queryLoadId = params.get('load');

    let load = null;

    if (shortMatch) {
      // Short link: resolve short_id → full load via dedicated endpoint
      const shortId = shortMatch[1].toLowerCase();
      try {
        const res = await fetch(`${API}/loads/s/${encodeURIComponent(shortId)}`);
        if (res.ok) {
          load = await res.json();
          if (load) allLoads.push(load);
        }
      } catch {}

    } else {
      // Long-form: full UUID from path or query param
      let loadId = queryLoadId || (pathMatch ? pathMatch[1] : null);
      if (!loadId) return;

      // Wait up to 5s for the initial load list to arrive
      let waited = 0;
      while (allLoads.length === 0 && waited < 5000) {
        await new Promise(r => setTimeout(r, 200));
        waited += 200;
      }

      load = allLoads.find(l => l.id === loadId) || null;
      if (!load) {
        try {
          const res = await fetch(`${API}/loads/${encodeURIComponent(loadId)}`);
          if (res.ok) { load = await res.json(); if (load) allLoads.push(load); }
        } catch {}
      }
    }

    if (load) {
      openDetail(load.id);
      // Normalise URL to query-param form so browser back works cleanly
      window.history.replaceState({}, '', `?load=${load.id}`);
    }
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────
  fetchLoads();
  setInterval(fetchLoads, 120_000);

  document.addEventListener('DOMContentLoaded', () => {
    setupLocationInput('fs-origin','origin-suggestions','origin-badge','origin', resolvedCoords);
    setupLocationInput('fs-dest',  'dest-suggestions',  'dest-badge',  'dest',   resolvedCoords);
    document.getElementById('fs-weight').addEventListener('keydown', e => { if(e.key==='Enter') findSpace(); });
    setupLocationInput('mob-origin','mob-origin-suggestions','mob-origin-badge','mob-origin', resolvedCoordsMob);
    setupLocationInput('mob-dest',  'mob-dest-suggestions',  'mob-dest-badge',  'mob-dest',   resolvedCoordsMob);
    document.getElementById('mob-weight').addEventListener('keydown', e => { if(e.key==='Enter') findSpaceMobile(); });
    handleDeepLink();
  });
</script>
</body>
