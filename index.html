<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TruckTraffic.in – India's Truck Load Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://apis.mappls.com/advancedmaps/api/xlpbqtrcpkscihyiexqxhnxramyzmkqkdqpd/map_sdk?layer=vector&v=3.0&callback=mapplsReady" defer></script>
  <style>
    :root {
      --navy: #0A2463;
      --orange: #FF6B35;
      --green: #248232;
      --bg: #F0F2F7;
      --surface: #FFFFFF;
      --text: #1A1A2E;
      --muted: #6C757D;
      --subtle: #ADB5BD;
      --border: #DEE2E6;
      --danger: #DC3545;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--navy);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(10,36,99,0.3);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--orange);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .logo-text span {
      color: var(--orange);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 100px;
      padding: 6px 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .download-btn {
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }

    .download-btn:hover { background: #e85a25; }

    /* ===== HERO ===== */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, #1a3a8f 50%, #0d1f5c 100%);
      padding: 24px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(255,107,53,0.1) 0%, transparent 50%),
                  radial-gradient(circle at 70% 30%, rgba(255,255,255,0.05) 0%, transparent 40%);
      pointer-events: none;
    }

    .hero-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }

    .hero h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero h1 span { color: var(--orange); }

    .hero p {
      font-size: 16px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--orange);
      display: block;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ===== FILTERS ===== */
    .filters-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 64px;
      z-index: 90;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .filters-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: var(--navy); }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
    }

    .filter-select {
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    .refresh-btn {
      padding: 10px 18px;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover { background: #0d2f7a; }

    .results-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    /* ===== MAIN ===== */
    .main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* ===== GRID ===== */
    .loads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(10,36,99,0.12);
    }

    .card-header {
      background: linear-gradient(135deg, var(--navy), #1a3a8f);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .truck-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 100px;
      padding: 4px 10px;
    }

    .truck-badge span {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }

    .date-badge {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      font-weight: 500;
    }

    .card-route {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .route-point { flex: 1; }

    .route-pin {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .route-city {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .route-state {
      font-size: 11px;
      color: var(--subtle);
    }

    .route-arrow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .arrow-line {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--navy), var(--orange));
      border-radius: 2px;
    }

    .arrow-icon {
      font-size: 18px;
      color: var(--orange);
      margin-top: -14px;
    }

    .card-divider {
      height: 1px;
      background: var(--border);
      margin: 0 20px;
    }

    .card-specs {
      padding: 16px 20px;
      display: flex;
      gap: 16px;
    }

    .spec {
      flex: 1;
      text-align: center;
    }

    .spec-value {
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
    }

    .spec-label {
      font-size: 10px;
      color: var(--subtle);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .card-footer {
      padding: 14px 20px;
      background: #F8F9FA;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .poster-info { flex: 1; }

    .poster-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .poster-company {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .poster-phone {
      font-size: 11px;
      color: var(--subtle);
      margin-top: 2px;
    }

    .call-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }

    .call-btn:hover { background: #1a6124; }

    .placement-chip {
      display: inline-block;
      background: #FFF4EE;
      color: var(--orange);
      border-radius: 100px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      margin: 0 20px 12px;
    }

    .show-photos-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 20px 16px;
      padding: 10px;
      background: #EEF2FA;
      border: 1.5px dashed var(--navy);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
      width: calc(100% - 40px);
    }

    .show-photos-btn:hover { background: #dce4f5; }

    .photos-grid {
      display: flex;
      gap: 8px;
      margin: 0 20px 16px;
      overflow-x: auto;
    }

    .photos-grid img {
      width: 100px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .photos-grid img:hover { transform: scale(1.05); }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      font-size: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== FIND SPACE PANEL ===== */
    .find-space-bar {
      background: linear-gradient(135deg, #0d2f7a, var(--navy));
      padding: 20px 24px;
      border-bottom: 3px solid var(--orange);
    }

    .find-space-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .find-space-title {
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .find-space-form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .find-space-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .find-space-field label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .find-space-field input {
      padding: 10px 14px;
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
      width: 140px;
      transition: border-color 0.2s;
    }

    .find-space-field input::placeholder { color: rgba(255,255,255,0.4); }
    .find-space-field input:focus { border-color: var(--orange); }

    .find-space-btn {
      padding: 10px 20px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
      height: 42px;
      white-space: nowrap;
    }

    .find-space-btn:hover { background: #e85a25; }
    .find-space-btn:disabled { background: #666; cursor: not-allowed; }

    .clear-filter-btn {
      padding: 10px 16px;
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      height: 42px;
      transition: all 0.2s;
    }

    .clear-filter-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .find-space-error {
      color: #FF6B6B;
      font-size: 12px;
      margin-top: 8px;
      font-weight: 500;
    }

    .find-space-status {
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      margin-top: 8px;
    }

    /* ===== LOCATION INPUT WRAPPER ===== */
    .loc-input-wrap {
      position: relative;
      width: 200px;
    }

    .loc-input-inner {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      transition: border-color 0.2s;
      overflow: visible;
    }

    .loc-input-inner:focus-within {
      border-color: var(--orange);
    }

    .loc-input-inner input {
      flex: 1;
      padding: 10px 6px 10px 12px;
      border: none !important;
      border-radius: 10px !important;
      background: transparent !important;
      color: #fff !important;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none !important;
      width: 100% !important;
      min-width: 0;
    }

    .loc-input-inner input::placeholder { color: rgba(255,255,255,0.4); }

    .loc-voice-btn {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      margin-right: 4px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: color 0.2s, background 0.15s;
      padding: 0;
    }

    .loc-voice-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .loc-voice-btn.listening { color: #FF6B6B; animation: voicePulse 1s infinite; }

    @keyframes voicePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .loc-type-badge {
      position: absolute;
      top: -8px;
      right: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 100px;
      pointer-events: none;
      transition: all 0.2s;
    }

    .loc-type-badge.pin {
      background: rgba(255,107,53,0.85);
      color: #fff;
    }

    .loc-type-badge.addr {
      background: rgba(74,222,128,0.85);
      color: #002;
    }

    /* Autocomplete dropdown */
    .loc-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      z-index: 999;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .loc-suggestions.open { display: block; }

    .loc-suggestion-item {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .loc-suggestion-item:last-child { border-bottom: none; }
    .loc-suggestion-item:hover { background: #F0F4FF; }

    .loc-suggestion-icon { flex-shrink: 0; margin-top: 1px; color: var(--navy); }

    .loc-suggestion-main { font-weight: 600; color: var(--text); }
    .loc-suggestion-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .loc-suggestion-spinner {
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .distance-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .distance-chip {
      background: #E8F5EA;
      color: var(--green);
      border-radius: 100px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .off-route-chip {
      background: #FFF4EE;
      color: var(--orange);
    }

    /* ===== LOADING ===== */
    .loading {
      text-align: center;
      padding: 80px 24px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p {
      color: var(--muted);
      font-size: 15px;
    }

    /* ===== EMPTY ===== */
    .empty {
      text-align: center;
      padding: 80px 24px;
      grid-column: 1 / -1;
    }

    .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .empty h3 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty p { color: var(--muted); font-size: 14px; }

    /* ===== ERROR ===== */
    .error-banner {
      background: #FFF5F5;
      border: 1px solid #FED7D7;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: var(--danger);
      font-size: 14px;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 24px;
      margin-top: 60px;
      font-size: 13px;
    }

    footer a { color: var(--orange); text-decoration: none; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .hero { padding: 40px 16px; }
      .hero-stats { gap: 24px; }
      .loads-grid { grid-template-columns: 1fr; }
      .filters-inner { flex-direction: column; align-items: stretch; }
      .search-box { min-width: unset; }
      .header-right .download-btn { display: none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <a href="/" class="logo">
      <div class="logo-icon">🚛</div>
      <span class="logo-text">Truck<span>Traffic</span>.in</span>
    </a>
    <div class="header-right">
      <div class="live-badge">
        <div class="live-dot"></div>
        Live Market
      </div>
      <a href="#" class="download-btn">📱 Download App</a>
    </div>
  </div>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <div class="hero-stats">
      <div class="stat">
        <span class="stat-value" id="stat-loads">—</span>
        <span class="stat-label">Active Loads</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-routes">—</span>
        <span class="stat-label">Routes</span>
      </div>
      <div class="stat">

<script>
  const API = 'https://ptl-market.onrender.com/api';
  // ⚙️  Replace with your actual Mappls REST API key
 const MAPPLS_REST_KEY = 'xlpbqtrcpkscihyiexqxhnxramyzmkqkdqpd';

  let allLoads = [];
  let activeFilter = null;
  let distanceMap = {};
  const geoCache = {};

  // Stores resolved {lat,lon} from address picks so findSpace can use them
  const resolvedCoords = { origin: null, dest: null };

  /* ============================================================
     LOCATION INPUT — Smart Pincode vs Address detection
  ============================================================ */

  function isPincode(val) {
    return /^\d{1,6}$/.test(val.trim());
  }

  function updateBadge(badgeId, val) {
    const badge = document.getElementById(badgeId);
    const v = val.trim();
    if (!v) { badge.textContent = ''; badge.className = 'loc-type-badge'; return; }
    if (/^\d{6}$/.test(v)) {
      badge.textContent = 'Pincode'; badge.className = 'loc-type-badge pin';
    } else if (/^\d{1,5}$/.test(v)) {
      badge.textContent = 'Pincode?'; badge.className = 'loc-type-badge pin';
    } else {
      badge.textContent = 'Address'; badge.className = 'loc-type-badge addr';
    }
  }

  /* ============================================================
     MAPPLS Autocomplete
  ============================================================ */

  let acTimers = {};

  function setupLocationInput(inputId, suggestionsId, badgeId, resolvedKey) {
    const input = document.getElementById(inputId);
    const sugBox = document.getElementById(suggestionsId);

    input.addEventListener('input', () => {
      const val = input.value;
      resolvedCoords[resolvedKey] = null; // reset when user types
      updateBadge(badgeId, val);

      clearTimeout(acTimers[inputId]);
      const trimmed = val.trim();

      // Only autocomplete addresses (not pure pincode attempts)
      if (trimmed.length < 3 || /^\d+$/.test(trimmed)) {
        closeSuggestions(suggestionsId);
        return;
      }

      acTimers[inputId] = setTimeout(() => fetchMapplsSuggestions(trimmed, suggestionsId, inputId, badgeId, resolvedKey), 300);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSuggestions(suggestionsId);
      if (e.key === 'Enter') { closeSuggestions(suggestionsId); findSpace(); }
    });

    // Close on outside click
    document.addEventListener('click', (e) => {
      if (!input.closest('.loc-input-wrap').contains(e.target)) {
        closeSuggestions(suggestionsId);
      }
    });
  }

  async function fetchMapplsSuggestions(query, suggestionsId, inputId, badgeId, resolvedKey) {
    const sugBox = document.getElementById(suggestionsId);
    sugBox.innerHTML = '<div class="loc-suggestion-spinner">🔍 Searching…</div>';
    sugBox.classList.add('open');

    try {
      const url = `https://atlas.mappls.com/api/places/search/json?query=${encodeURIComponent(query)}&region=IND&access_token=${MAPPLS_REST_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      const suggestions = (data.suggestedLocations || []).slice(0, 6);

      if (!suggestions.length) {
        sugBox.innerHTML = '<div class="loc-suggestion-spinner">No results found</div>';
        return;
      }

      sugBox.innerHTML = suggestions.map((s, i) => `
        <div class="loc-suggestion-item" data-idx="${i}" data-lat="${s.latitude}" data-lon="${s.longitude}" data-label="${escapeAttr(s.placeName)}" data-type="${s.type || ''}">
          <span class="loc-suggestion-icon">📍</span>
          <div>
            <div class="loc-suggestion-main">${escapeHtml(s.placeName)}</div>
            <div class="loc-suggestion-sub">${escapeHtml(s.placeAddress || s.type || '')}</div>
          </div>
        </div>
      `).join('');

      sugBox.querySelectorAll('.loc-suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          const lat = parseFloat(item.dataset.lat);
          const lon = parseFloat(item.dataset.lon);
          const label = item.dataset.label;
          document.getElementById(inputId).value = label;
          resolvedCoords[resolvedKey] = { lat, lon, found: true };
          updateBadge(badgeId, label);
          closeSuggestions(suggestionsId);
        });
      });
    } catch (err) {
      sugBox.innerHTML = '<div class="loc-suggestion-spinner">⚠️ Search unavailable</div>';
    }
  }

  function closeSuggestions(id) {
    const el = document.getElementById(id);
    if (el) { el.classList.remove('open'); el.innerHTML = ''; }
  }

  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(s) {
    return String(s || '').replace(/"/g,'&quot;');
  }

  /* ============================================================
     VOICE RECOGNITION
  ============================================================ */

  let activeRecognition = null;

  function startVoice(inputId, btnId) {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert('Voice recognition is not supported in your browser. Please use Chrome or Edge.');
      return;
    }

    // Stop any active session
    if (activeRecognition) {
      activeRecognition.stop();
      activeRecognition = null;
    }

    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    activeRecognition = recognition;

    recognition.lang = 'en-IN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    btn.classList.add('listening');
    btn.textContent = '🔴';
    btn.title = 'Listening…';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      input.value = transcript;
      input.dispatchEvent(new Event('input'));
    };

    recognition.onerror = (event) => {
      console.warn('Voice error:', event.error);
    };

    recognition.onend = () => {
      btn.classList.remove('listening');
      btn.textContent = '🎙';
      btn.title = btn.id === 'voice-origin' ? 'Speak origin' : 'Speak destination';
      activeRecognition = null;
    };

    recognition.start();
  }

  /* ============================================================
     GEO MATH
  ============================================================ */

  function toRad(d) { return d * Math.PI / 180; }

  function haversineKm(a, b) {
    const R = 6371;
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lon - a.lon);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);
    const x = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }

  function bearingRad(a, b) {
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const dLon = toRad(b.lon - a.lon);
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    return Math.atan2(y, x);
  }

  function trackDistancesKm(start, end, p) {
    const R = 6371;
    const d13 = haversineKm(start, p) / R;
    const t13 = bearingRad(start, p);
    const t12 = bearingRad(start, end);
    const xt = Math.asin(Math.sin(d13) * Math.sin(t13 - t12)) * R;
    const at = Math.acos(Math.cos(d13) / Math.cos(xt / R)) * R;
    return { cross: Math.abs(xt), along: at };
  }

  async function geocodePin(pin) {
    if (geoCache[pin]) return geoCache[pin];
    try {
      const r = await fetch(`${API}/geocode/${pin}`);
      const j = await r.json();
      const out = { lat: j.lat || 0, lon: j.lon || 0, found: !!j.found };
      if (out.found) geoCache[pin] = out;
      return out;
    } catch {
      return { lat: 0, lon: 0, found: false };
    }
  }

  /* ============================================================
     FIND SPACE — supports both pincode and address
  ============================================================ */

  async function resolveLocation(inputId, resolvedKey, labelName) {
    const val = document.getElementById(inputId).value.trim();
    if (!val) return { coords: null, error: `⚠️ Enter your ${labelName} (pincode or address)` };

    // If user picked from autocomplete, we already have coords
    if (resolvedCoords[resolvedKey]) return { coords: resolvedCoords[resolvedKey], error: null };

    // 6-digit pincode
    if (/^\d{6}$/.test(val)) {
      const c = await geocodePin(val);
      if (!c.found) return { coords: null, error: `⚠️ ${labelName} pincode not found` };
      return { coords: c, error: null };
    }

    // Pure numbers that aren't 6 digits
    if (/^\d+$/.test(val)) {
      return { coords: null, error: `⚠️ Pincodes must be 6 digits. For addresses, type the full name.` };
    }

    // Address — try Mappls geocode
    try {
      const url = `https://atlas.mappls.com/api/places/search/json?query=${encodeURIComponent(val)}&region=IND&access_token=${MAPPLS_REST_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      const first = (data.suggestedLocations || [])[0];
      if (first && first.latitude) {
        return { coords: { lat: parseFloat(first.latitude), lon: parseFloat(first.longitude), found: true }, error: null };
      }
      return { coords: null, error: `⚠️ Could not locate "${val}". Try being more specific or use a pincode.` };
    } catch {
      return { coords: null, error: `⚠️ Address search failed. Please use a pincode instead.` };
    }
  }

  async function findSpace() {
    const weightKg = parseFloat(document.getElementById('fs-weight').value);
    const volumeCuft = document.getElementById('fs-volume').value.trim()
      ? parseFloat(document.getElementById('fs-volume').value)
      : null;

    const errorEl = document.getElementById('fs-error');
    const statusEl = document.getElementById('fs-status');
    errorEl.textContent = '';
    statusEl.textContent = '';

    if (!weightKg || weightKg <= 0) { errorEl.textContent = '⚠️ Enter your cargo weight in kg'; return; }

    const btn = document.getElementById('fs-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Searching...';
    statusEl.textContent = 'Resolving your locations…';

    try {
      const [originRes, destRes] = await Promise.all([
        resolveLocation('fs-origin', 'origin', 'origin'),
        resolveLocation('fs-dest', 'dest', 'destination')
      ]);

      if (originRes.error) { errorEl.textContent = originRes.error; return; }
      if (destRes.error)   { errorEl.textContent = destRes.error; return; }

      const oc = originRes.coords;
      const dc = destRes.coords;

      statusEl.textContent = `Checking ${allLoads.length} trucks against your route...`;

      const survivors = [];
      distanceMap = {};

      for (const load of allLoads) {
        if (load.weight_tons * 1000 < weightKg) continue;
        if (volumeCuft != null && load.space_cuft != null && load.space_cuft < volumeCuft) continue;

        const lo = await geocodePin(load.origin_pincode);
        if (!lo.found) continue;
        const ld = await geocodePin(load.destination_pincode);
        if (!ld.found) continue;

        // Path A: endpoint match ≤ 15 km on both ends
        const dOrigin = haversineKm(oc, lo);
        const dDest = haversineKm(dc, ld);
        if (dOrigin <= 15 && dDest <= 15) {
          distanceMap[load.id] = { origin: dOrigin, dest: dDest, offRoute: false };
          survivors.push({ load, total: dOrigin + dDest });
          continue;
        }

        // Path B: route deviation ≤ 15 km for long-haul trucks (> 400 km)
        const routeLen = haversineKm(lo, ld);
        if (routeLen > 400) {
          const oTrack = trackDistancesKm(lo, ld, oc);
          const dTrack = trackDistancesKm(lo, ld, dc);
          const inSeg = at => at >= 0 && at <= routeLen;
          if (
            oTrack.cross <= 15 &&
            dTrack.cross <= 15 &&
            inSeg(oTrack.along) &&
            inSeg(dTrack.along) &&
            oTrack.along <= dTrack.along
          ) {
            distanceMap[load.id] = { origin: oTrack.cross, dest: dTrack.cross, offRoute: true };
            survivors.push({ load, total: oTrack.cross + dTrack.cross });
            continue;
          }
        }
      }

      survivors.sort((a, b) => a.total - b.total);
      const origin = document.getElementById('fs-origin').value.trim();
      const dest = document.getElementById('fs-dest').value.trim();
      activeFilter = { origin, dest, weightKg, volumeCuft, oc, dc };

      document.getElementById('fs-clear-wrap').style.display = 'block';
      statusEl.textContent = `✅ Found ${survivors.length} matching truck${survivors.length !== 1 ? 's' : ''} within 15 km of your route`;

      document.getElementById('results-count').textContent =
        `${survivors.length} truck${survivors.length !== 1 ? 's' : ''} matched`;

      renderLoads(survivors.map(s => s.load), true);

    } catch (e) {
      errorEl.textContent = '⚠️ Something went wrong. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = '🚛 Find Matching Trucks';
    }
  }

  function clearFindSpace() {
    activeFilter = null;
    distanceMap = {};
    resolvedCoords.origin = null;
    resolvedCoords.dest = null;
    document.getElementById('fs-origin').value = '';
    document.getElementById('fs-dest').value = '';
    document.getElementById('origin-badge').textContent = '';
    document.getElementById('dest-badge').textContent = '';
    document.getElementById('fs-clear-wrap').style.display = 'none';
    document.getElementById('fs-error').textContent = '';
    document.getElementById('fs-status').textContent = '';
    filterLoads();
  }

  // ===== FETCH & FILTER =====
  async function fetchLoads() {
    const container = document.getElementById('loads-container');
    const errorContainer = document.getElementById('error-container');
    errorContainer.innerHTML = '';

    container.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading live truck loads...</p>
      </div>
    `;

    try {
      const res = await fetch(`${API}/loads`);
      if (!res.ok) throw new Error('Failed to fetch');
      allLoads = await res.json();
      updateStats();
      filterLoads();
    } catch (err) {
      errorContainer.innerHTML = `
        <div class="error-banner">
          ⚠️ Unable to load data. Please try refreshing in a moment.
        </div>
      `;
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📡</div>
          <h3>Connection Error</h3>
          <p>Could not connect to the server. Please try again.</p>
        </div>
      `;
    }
  }

  function updateStats() {
    document.getElementById('stat-loads').textContent = allLoads.length;
    const routes = new Set(allLoads.map(l => `${l.origin_pincode}-${l.destination_pincode}`)).size;
    document.getElementById('stat-routes').textContent = routes;
    const totalWeight = allLoads.reduce((s, l) => s + (l.weight_tons || 0), 0).toFixed(0);
    document.getElementById('stat-weight').textContent = totalWeight + 'T';
  }

  function filterLoads() {
    const truckFilter = document.getElementById('truck-filter').value;

    const filtered = allLoads.filter(load => {
      const matchTruck = !truckFilter || load.truck_type === truckFilter;
      return matchTruck;
    });

    document.getElementById('results-count').textContent =
      `${filtered.length} truck${filtered.length !== 1 ? 's' : ''} found`;

    renderLoads(filtered, false);
  }

  function renderLoads(loads, isFiltered = false) {
    const container = document.getElementById('loads-container');

    if (loads.length === 0) {
      container.innerHTML = `
        <div class="loads-grid">
          <div class="empty">
            <div class="empty-icon">🚛</div>
            <h3>${isFiltered ? 'No matching trucks found' : 'No loads found'}</h3>
            <p>${isFiltered ? 'Try adjusting your cargo details or expand your route.' : 'Try adjusting your search or check back later.'}</p>
          </div>
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="loads-grid">${loads.map((load, i) => renderCard(load, i)).join('')}</div>
      ${isFiltered ? '<p style="text-align:center;color:var(--subtle);font-size:12px;margin-top:16px">* Distances are approximate (straight-line)</p>' : ''}
    `;
  }

  function renderCard(load, index) {
    const date = formatDate(load.loading_date);
    const originCity = load.origin_city || load.origin_pincode;
    const destCity = load.destination_city || load.destination_pincode;
    const imageCount = load.image_count || 0;
    const dist = distanceMap[load.id];

    return `
      <div class="card" style="animation-delay: ${index * 0.05}s">
        <div class="card-header">
          <div class="truck-badge">
            <span>🚛 ${load.truck_type || 'Truck'}</span>
          </div>
          <span class="date-badge">📅 ${date}</span>
        </div>

        <div class="card-route">
          <div class="route-point">
            <div class="route-pin">${load.origin_pincode}</div>
            <div class="route-city">${originCity}</div>
            <div class="route-state">${load.origin_state || ''}</div>
          </div>
          <div class="route-arrow">
            <div class="arrow-line"></div>
            <div class="arrow-icon">➤</div>
          </div>
          <div class="route-point" style="text-align:right">
            <div class="route-pin">${load.destination_pincode}</div>
            <div class="route-city">${destCity}</div>
            <div class="route-state">${load.destination_state || ''}</div>
          </div>
        </div>

        ${dist ? `
          <div class="distance-chips" style="padding: 0 20px 12px">
            <span class="distance-chip ${dist.offRoute ? 'off-route-chip' : ''}">
              📍 Origin: ${dist.origin.toFixed(1)} km ${dist.offRoute ? 'off-route' : 'away'}
            </span>
            <span class="distance-chip ${dist.offRoute ? 'off-route-chip' : ''}">
              🏁 Dest: ${dist.dest.toFixed(1)} km ${dist.offRoute ? 'off-route' : 'away'}
            </span>
          </div>
        ` : ''}

        ${load.cargo_placement ? `<div class="placement-chip">${load.cargo_placement}</div>` : ''}

        ${imageCount > 0 ? `
          <button class="show-photos-btn" onclick="togglePhotos(this, '${load.id}', ${imageCount})">
            📸 Show ${imageCount} Photo${imageCount > 1 ? 's' : ''}
          </button>
          <div class="photos-grid" id="photos-${load.id}" style="display:none"></div>
        ` : ''}

        <div class="card-divider"></div>

        <div class="card-specs">
          <div class="spec">
            <div class="spec-value">${load.weight_tons}T</div>
            <div class="spec-label">Weight</div>
          </div>
          <div class="spec">
            <div class="spec-value">${load.space_cuft ? load.space_cuft + ' ft³' : '—'}</div>
            <div class="spec-label">Space</div>
          </div>
          <div class="spec">
            <div class="spec-value">${imageCount}</div>
            <div class="spec-label">Photos</div>
          </div>
        </div>

        <div class="card-footer">
          <div class="poster-info">
            <div class="poster-name">${load.poster_name}</div>
            ${load.poster_company ? `<div class="poster-company">${load.poster_company}</div>` : ''}
            <div class="poster-phone">+91 ${load.poster_phone}</div>
          </div>
          <a href="tel:${load.poster_phone}" class="call-btn">
            📞 Call
          </a>
        </div>
      </div>
    `;
  }

  function togglePhotos(btn, loadId, imageCount) {
    const grid = document.getElementById(`photos-${loadId}`);
    if (grid.style.display === 'none') {
      grid.innerHTML = '';
      for (let i = 0; i < imageCount; i++) {
        const img = document.createElement('img');
        img.src = `https://ptl-market.onrender.com/api/loads/${loadId}/image/${i}`;
        img.alt = `Photo ${i + 1}`;
        img.onclick = () => openLightbox(img.src);
        img.onerror = () => img.style.display = 'none';
        grid.appendChild(img);
      }
      grid.style.display = 'flex';
      btn.textContent = '🙈 Hide Photos';
    } else {
      grid.style.display = 'none';
      btn.textContent = `📸 Show ${imageCount} Photo${imageCount > 1 ? 's' : ''}`;
    }
  }

  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightbox-img').src = '';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    try {
      return new Date(dateStr).toLocaleDateString('en-IN', {
        day: '2-digit', month: 'short', year: 'numeric'
      });
    } catch { return dateStr; }
  }

  document.addEventListener('DOMContentLoaded', () => {
    setupLocationInput('fs-origin', 'origin-suggestions', 'origin-badge', 'origin');
    setupLocationInput('fs-dest',   'dest-suggestions',   'dest-badge',   'dest');

    ['fs-weight','fs-volume'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') findSpace();
      });
    });
  });

  fetchLoads();
  setInterval(fetchLoads, 120000);
</script>
</body>
</html>
